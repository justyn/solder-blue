# Image-baked CUPS queues for solder-blue.
# CUPS rewrites this file as queues are added/modified at runtime; image-shipped
# entries are the baseline that exists on a fresh boot. CUPS assigns PrinterId,
# UUID, StateTime, ConfigTime, Type, NextPrinterId, and SNMP marker-* attributes
# on first run, so they're intentionally omitted here.
#
# Brother HL-3070CW: pinned to the cups-filters pxlcolor PPD (PCL XL via
# Ghostscript's `gstopxl`) instead of the auto-discovered Brother BR-Script3
# PPD, which hits `limitcheck` on this model's 21 MB free RAM and silently
# fails on anything moderately complex. See files/system/etc/cups/ppd/.
<DefaultPrinter Brother-HL-3070CW-series>
Info Brother HL-3070CW series
MakeModel HP Color LaserJet Series PCL 6 CUPS
DeviceURI dnssd://Brother%20HL-3070CW%20series._pdl-datastream._tcp.local/
State Idle
Accepting Yes
Shared Yes
JobSheets none none
QuotaPeriod 0
PageLimit 0
KLimit 0
OpPolicy default
ErrorPolicy stop-printer
</DefaultPrinter>
